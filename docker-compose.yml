name: edulms

services:
  # Dịch vụ Cơ sở dữ liệu MongoDB
  mongodb:
    image: mongo:6.0
    container_name: edulms-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=edulms
    volumes:
      - mongodb_data:/data/db
    networks:
      - edulms-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Dịch vụ Express REST API Backend
  backend:
    build:
      context: ./edulms-backend
      dockerfile: Dockerfile
    container_name: edulms-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/edulms
      - CLIENT_URL=http://localhost:5173
      - NODE_ENV=development
      - JWT_SECRET=edulms_jwt_secret_dev_key_2026
      - JWT_REFRESH_SECRET=edulms_jwt_refresh_secret_dev_key_2026
    volumes:
      # Ánh xạ mã nguồn để đồng bộ thay đổi realtime trong quá trình phát triển (Live Reload)
      - ./edulms-backend:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - edulms-network

  # Dịch vụ React Vite Frontend
  frontend:
    build:
      context: ./edulms-frontend
      dockerfile: Dockerfile
    container_name: edulms-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    volumes:
      # Ánh xạ mã nguồn Frontend để Hot Module Replacement (HMR) trong container
      - ./edulms-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - edulms-network

# Persistence Volume cho dữ liệu MongoDB
volumes:
  mongodb_data:
    driver: local

# Docker Bridge Network kết nối giữa các Container
networks:
  edulms-network:
    driver: bridge
